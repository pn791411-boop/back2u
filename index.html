<!-- Firebase (module) -->
<script type="module">
  // IMPORT
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔥 DÁN CONFIG TẠI ĐÂY
  const firebaseConfig = {
    apiKey: "DÁN_API_KEY",
    authDomain: "DÁN_DOMAIN",
    projectId: "DÁN_PROJECT_ID",
    storageBucket: "DÁN_BUCKET",
    messagingSenderId: "DÁN_SENDER",
    appId: "DÁN_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getFirestore();

  const provider = new GoogleAuthProvider();
  let currentUser = null;

  // LOGIN
  window.loginGoogle = () => {
    signInWithPopup(auth, provider);
  };

  // LOGOUT
  window.logout = () => {
    signOut(auth);
  };

  // USER STATE
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.getElementById("userName").innerText = user ? user.displayName : "Chưa đăng nhập";
  });

  // POST
  window.postItem = async () => {
    const type = document.getElementById("type").value;
    const item = document.getElementById("item").value;
    const other = document.getElementById("other").value;
    const location = document.getElementById("location").value;
    const desc = document.getElementById("desc").value;

    await addDoc(collection(db, "posts"), {
      user: currentUser?.displayName || "Ẩn danh",
      type,
      item,
      other,
      location,
      desc,
      time: new Date()
    });
  };

  // LOAD POSTS REALTIME
  const q = query(collection(db, "posts"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    let html = "";
    snapshot.forEach(doc => {
      const d = doc.data();
      html += `
        <div class="post">
          <b>${d.user}</b><br>
          ${d.type} - ${d.item} ${d.other || ""}<br>
          📍 ${d.location}<br>
          📝 ${d.desc}
        </div>
      `;
    });
    document.getElementById("posts").innerHTML = html;
  });
</script>
